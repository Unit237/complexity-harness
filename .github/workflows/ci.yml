name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Dogfood repository scan
        run: |
          complexity-harness scan . --output /tmp/complexity-harness.json
          complexity-harness validate /tmp/complexity-harness.json
          complexity-harness report /tmp/complexity-harness.json --top 10 --output /tmp/complexity-report.md

      - name: Build distributions
        if: matrix.python-version == '3.11'
        run: python -m build
