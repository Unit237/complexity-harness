name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: python -m pytest
      - run: complexity-harness scan . --output /tmp/complexity-snapshot.json
      - run: complexity-harness validate /tmp/complexity-snapshot.json
